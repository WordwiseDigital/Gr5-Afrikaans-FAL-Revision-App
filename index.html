<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graad 5 Afrikaans Avontuur</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Graad 5 Afrikaans Avontuur</h1>
        </header>
        <main id="game-container">
            <div id="start-screen">
                <h2>Welkom by die Tropiese Avontuur!</h2>
                <p>Kies 'n onderwerp om te begin speel.</p>
                <div id="topic-selection"></div>
                <button id="start-button">Begin Speletjie</button>
            </div>
            <div id="game-screen" class="hidden">
                <div id="question-container">
                    <p id="question-text"></p>
                </div>
                <div id="answer-options"></div>
                <div id="feedback" class="hidden"></div>
                <button id="next-button" class="hidden">Volgende Vraag</button>
            </div>
            <div id="score-container">
                <p>Punte: <span id="score">0</span></p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
